<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thẻ 7 bậc · In</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..900&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Noto+Serif+Display:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}
:root{--ink:#0b0b0b;--paper:#fff;--red:#ff4a1c;--mut:#6b675f}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:#e7e3da}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px;background:var(--ink);color:#f2efe8;font:500 13px 'JetBrains Mono',monospace;letter-spacing:.04em}
.bar button{font:600 13px 'JetBrains Mono',monospace;padding:10px 16px;border:0;border-radius:99px;background:var(--red);color:var(--ink);cursor:pointer;text-transform:uppercase;letter-spacing:.08em}
.bar input{width:70px;padding:7px;border:0;font:inherit}
.page{width:210mm;height:297mm;margin:16px auto;background:#fff;display:grid;grid-template-rows:1fr 1fr;box-shadow:0 10px 40px -10px rgba(0,0,0,.3)}
.card{padding:9mm 11mm 8mm;display:flex;flex-direction:column;gap:3mm;position:relative}
.card+.card{border-top:1.2px dashed #aaa}
.card+.card::before{content:'✂';position:absolute;top:-11px;left:6mm;font-size:15px;color:#888;background:#fff;padding:0 4px}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.6px solid var(--ink);padding-bottom:2mm}
.head h1{margin:0;font:800 30pt/0.9 'Archivo',sans-serif;font-stretch:62%;text-transform:uppercase;letter-spacing:-.01em}
.head h1 em{font-style:normal;color:var(--red)}
.head span{font:500 7.5pt/1.4 'JetBrains Mono',monospace;color:var(--mut);text-align:right;text-transform:uppercase;letter-spacing:.08em}
.who{display:grid;grid-template-columns:1.3fr 1fr;gap:6mm;font-size:9.5pt}
.who div{border-bottom:1px solid #999;padding-bottom:1mm;color:var(--mut)}
.tang{display:flex;gap:4mm;align-items:center;font-size:8.5pt;color:var(--mut)}
.tang b{font:600 7.5pt 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.tang i{display:inline-block;width:3.4mm;height:3.4mm;border:1.2px solid var(--ink);margin-right:1.2mm;vertical-align:-.6mm}
.lv{display:grid;gap:1.2mm;border-top:1px solid var(--ink)}
.lv div{display:grid;grid-template-columns:6mm 13mm 1fr;align-items:center;gap:2mm;font-size:9.6pt;padding:1.1mm 0;border-bottom:1px solid #ddd}
.lv i{width:4.6mm;height:4.6mm;border:1.4px solid var(--ink)}
.lv b{font:800 12pt/1 'Archivo',sans-serif;font-stretch:62%;color:var(--red)}
.lv span small{color:var(--mut)}
.three{display:grid;grid-template-columns:repeat(3,1fr);border:1.2px solid var(--ink)}
.three div{padding:2mm 2.6mm;font-size:8.2pt;line-height:1.35}
.three div+div{border-left:1px solid var(--ink)}
.three b{display:block;font:800 11pt/1 'Archivo',sans-serif;font-stretch:66%;text-transform:uppercase;margin-bottom:.8mm}
.three-h{font:600 7.5pt 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.dare{display:grid;gap:2.2mm;font-size:9.2pt}
.dare h2{margin:0;font:400 15pt/1 'Noto Serif Display',serif}
.dare h2 em{font-style:italic;font-weight:300;color:var(--red)}
.dare div{border-bottom:1px dashed #999;padding-bottom:5mm;color:var(--mut)}
.foot{margin-top:auto;font:500 7.2pt 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;gap:4mm}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;page-break-after:always}}
</style>
</head>
<body>
<div class="bar">
  <span>In <b>2 thẻ / trang A4</b>, cắt theo đường ✂ · Số trang:</span>
  <input id="n" type="number" min="1" max="30" value="13">
  <button onclick="window.print()">In thẻ</button>
  <span style="opacity:.7">(13 trang = 26 thẻ)</span>
</div>
<div id="pages"></div>
<template id="card">
  <div class="card">
    <div class="head"><h1>Thẻ <em>7 bậc</em> của tôi</h1><span>Làm thật, thấy thật · V2<br>7 bậc đi xuống phễu, làm bạn với AI</span></div>
    <div class="who"><div>Tên:</div><div>Ngành:</div></div>
    <div class="tang"><b>Hôm nay tôi ở tầng</b><span><i></i>Thỉnh thoảng</span><span><i></i>Thành thạo</span><span><i></i>Giao cả đầu việc</span></div>
    <div class="lv">
      <div><i></i><b>Bậc 1</b><span>Giao như cho đồng nghiệp, nhờ góp ý thẳng <small>· email khó</small></span></div>
      <div><i></i><b>Bậc 2</b><span>Hỏi "căn cứ đâu?" <small>· bắt được AI đoán</small></span></div>
      <div><i></i><b>Bậc 3</b><span>Đưa đống bừa bộn, nhờ sắp xếp <small>· Excel sạch</small></span></div>
      <div><i></i><b>Bậc 4</b><span>Một cuộc trò chuyện, nhiều thành phẩm <small>· báo cáo → slide</small></span></div>
      <div><i></i><b>Bậc 5</b><span>Mình sẽ dạy bạn ấy việc: ………………………………………</span></div>
      <div><i></i><b>Bậc 6</b><span>Mình sẽ nhờ bạn ấy làm công cụ: …………………………………</span></div>
      <div><i></i><b>Bậc 7</b><span>Đã thấy bạn ấy làm cả đầu việc</span></div>
    </div>
    <span class="three-h">Giao việc như giao cho đồng nghiệp · nói rõ 3 điều</span>
    <div class="three"><div><b>Muốn gì</b>Mục tiêu, cho ai, thế nào là tốt</div><div><b>Công sức</b>Nhanh gọn, hay làm thật kỹ</div><div><b>Kiểm tra</b>Kiểm thế nào, báo lại đã kiểm gì</div></div>
    <div class="dare">
      <h2>Bạn <em>dám nhờ</em> gì?</h2>
      <div>01 · Việc công việc sẽ nhờ tuần này:</div>
      <div>02 · Việc đời sống chưa từng nghĩ có thể nhờ:</div>
      <div>03 · Việc táo bạo nhất muốn giao:</div>
    </div>
    <div class="foot"><span>Dám nhờ mọi thứ · dám hỏi lại mọi thứ · hỏi thẳng bạn ấy</span><span>Tích ≥ 4 ô → chứng nhận Level Up</span></div>
  </div>
</template>
<script>
function build() {
  const n = Math.max(1, Math.min(30, +document.getElementById('n').value || 1));
  const tpl = document.getElementById('card');
  const box = document.getElementById('pages');
  box.replaceChildren();
  for (let i = 0; i < n; i++) {
    const page = document.createElement('div');
    page.className = 'page';
    page.append(tpl.content.cloneNode(true), tpl.content.cloneNode(true));
    box.append(page);
  }
}
document.getElementById('n').addEventListener('input', build);
build();
</script>
</body>
</html>
