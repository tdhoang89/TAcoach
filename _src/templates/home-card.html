<a class="look {{TONE}}" href="{{SLUG}}.html" data-cursor="Vào bài">
  <div class="look-top"><span class="label">Bậc {{N}}</span><span class="look-steps" aria-hidden="true">{{STEPS}}</span></div>
  <div class="look-n" aria-hidden="true">{{N}}</div>
  <h3 class="look-t">{{TITLE}}</h3>
  <p class="look-h">{{HOW}}</p>
  <div class="look-meta"><span class="chip">{{TIME}}</span><span class="chip">{{TOOLS}}</span><span class="chip">Miễn phí: {{FREE}}</span></div>
  <div class="look-go"><span>Vào bài →</span><span class="look-prog" data-card-progress="{{SLUG}}" data-total="{{NTASK}}"></span></div>
</a>
